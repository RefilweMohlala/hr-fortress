
networks:
  hr_fortress_net:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
  ollama_data:

services:

  postgres:
    image: postgres:16
    container_name: hr_fortress_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Africa/Johannesburg
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    networks:
      - hr_fortress_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    container_name: hr_fortress_n8n
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: hr_fortress_postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      GENERIC_TIMEZONE: Africa/Johannesburg
      TZ: Africa/Johannesburg
      NODE_FUNCTION_ALLOW_BUILTIN: "*"
      NODE_FUNCTION_ALLOW_EXTERNAL: pdf-parse
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./hr_module:/data/hr_module
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hr_fortress_net

  ollama:
    image: ollama/ollama:latest
    container_name: hr_fortress_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - hr_fortress_net
    environment:
      - OLLAMA_KEEP_ALIVE=15m